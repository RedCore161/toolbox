# Usage: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up
# Requires the NVIDIA driver + Docker Desktop WSL2 backend (Windows) or nvidia-container-toolkit (Linux).
services:
  vision:
    environment:
      WEVIS_DEVICE: cuda:0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
